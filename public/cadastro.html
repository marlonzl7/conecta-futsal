<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/forms.css">
    <link rel="stylesheet" href="./style/buttons.css">
    <script src="./js/redirecionamentos.js"></script>
    <script src="./js/validacoes.js"></script>
    <script src="./js/cadastrar.js"></script>
    <title>Conecta Futsal - Cadastro</title>
</head>
<body>
    <main class="main">
        <header class="header">
            <h2>Cadastro</h2>
            <p>Insira suas informações para cadastrar sua conta</p>
        </header>

        <div class="main-content">
            <div class="input-group">
                <div class="input-box">
                    <input type="text" name="nome" id="nome" placeholder="Nome" oninput="validarNome(nome.value)">
                    <div class="error"><span id="nomeInvalido"></span></div>
                </div>

                <div class="input-box">
                    <input type="text" name="sobrenome" id="sobrenome" placeholder="Sobrenome" oninput="validarSobrenome(sobrenome.value)">
                    <div class="error"><span id="sobrenomeInvalido"></span></div>
                </div>

                <div class="input-box">
                    <input type="date" name="dataNascimento" id="dataNascimento">
                    <div class="error"><span id="dataNascimentoInvalida"></span></div>
                </div>

                <div class="input-box">
                    <input type="text" name="telefone" id="telefone" placeholder="Telefone (opcional)" oninput="validarTelefone(telefone.value)" maxlength="11">
                    <div class="error"><span id="telefoneInvalido"></span></div>
                </div>

                <div class="input-box">
                    <input type="email" name="email" id="email" placeholder="Email" oninput="validarEmail(email.value)">
                    <div class="error"><span id="emailInvalido"></span></div>
                </div>

                <div class="input-box">
                    <input type="password" name="senha" id="senha" placeholder="Senha" oninput="validarSenha(senha.value)">
                    <div class="error"><span id="senhaInvalida"></span></div>
                </div>

                <div class="input-box">
                    <select name="tipoUsuario" id="tipoUsuario" placeholder="Quem é você?" oninput="validarTipoUsuario(tipoUsuario.value)">
                        <option value="#">Selecione...</option>
                        <option value="jogador">Jogador</option>
                        <option value="tecnico">Técnico</option>
                    </select>
                    <div class="error"><span id="tipoUsuarioInvalido"></span></div>
                </div>
            </div>

            <div class="actions">
                <div class="cadastrar">
                    <button onclick="cadastrar(nome.value, sobrenome.value, telefone.value, email.value, senha.value, tipoUsuario.value)" class="btn btn-principal" id="btn-cadastrar">Cadastrar</button>
                </div>

                <div class="login">
                    <p id="possui-conta">Já possuí uma conta?</p>
                    <button onclick="redirecionarParaLogin()" class="btn btn-secundario">Fazer login</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
